[build]
  publish = "public"
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"

[functions."auto-settle"]
  schedule = "*/10 * * * *"

[[redirects]]
  from = "/api/bzzoiro"
  to = "/.netlify/functions/bzzoiro"
  status = 200

[[redirects]]
  from = "/api/picks"
  to = "/.netlify/functions/picks"
  status = 200

[[redirects]]
  from = "/api/auto-settle"
  to = "/.netlify/functions/auto-settle"
  status = 200
