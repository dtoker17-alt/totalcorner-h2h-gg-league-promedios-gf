<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" role="img" aria-labelledby="title desc">
  <title id="title">Football AI analytics dashboard</title>
  <desc id="desc">Own abstract football analytics scene with pitch, probability cards, value graph and neural lines.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#101a2d"/>
      <stop offset=".52" stop-color="#07111f"/>
      <stop offset="1" stop-color="#06100d"/>
    </linearGradient>
    <linearGradient id="pitch" x1="0" x2="1">
      <stop offset="0" stop-color="#0f7b72"/>
      <stop offset=".55" stop-color="#1ec890"/>
      <stop offset="1" stop-color="#166b75"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" x2="1">
      <stop offset="0" stop-color="#2be39b"/>
      <stop offset="1" stop-color="#55d8ff"/>
    </linearGradient>
    <linearGradient id="hot" x1="0" x2="1">
      <stop offset="0" stop-color="#ffd464"/>
      <stop offset="1" stop-color="#a889ff"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="960" height="420" rx="34" fill="url(#bg)"/>
  <circle cx="105" cy="62" r="105" fill="#2be39b" opacity=".14"/>
  <circle cx="860" cy="320" r="140" fill="#55d8ff" opacity=".11"/>
  <path d="M72 326 C210 224, 354 386, 520 250 S762 104, 898 174" fill="none" stroke="#55d8ff" stroke-width="2" opacity=".38"/>
  <path d="M68 354 C222 270, 345 392, 516 294 S760 160, 900 206" fill="none" stroke="#2be39b" stroke-width="2" opacity=".28"/>

  <g transform="translate(48 52)">
    <rect width="210" height="82" rx="18" fill="#111a2c" stroke="#2a3957"/>
    <text x="20" y="30" fill="#91a1bc" font-family="Inter,Segoe UI,sans-serif" font-size="15">Modelo IA</text>
    <text x="20" y="61" fill="#f6f8fc" font-family="Inter,Segoe UI,sans-serif" font-size="30" font-weight="800">Value + EV</text>
    <circle cx="174" cy="42" r="22" fill="none" stroke="url(#accent)" stroke-width="8"/>
  </g>

  <g transform="translate(702 46)">
    <rect width="208" height="144" rx="22" fill="#101827" stroke="#2a3957"/>
    <text x="18" y="31" fill="#f6f8fc" font-family="Inter,Segoe UI,sans-serif" font-size="18" font-weight="800">Risk Control</text>
    <rect x="18" y="52" width="172" height="12" rx="6" fill="#26324a"/>
    <rect x="18" y="52" width="132" height="12" rx="6" fill="url(#accent)"/>
    <rect x="18" y="82" width="172" height="12" rx="6" fill="#26324a"/>
    <rect x="18" y="82" width="96" height="12" rx="6" fill="url(#hot)"/>
    <rect x="18" y="112" width="172" height="12" rx="6" fill="#26324a"/>
    <rect x="18" y="112" width="150" height="12" rx="6" fill="#2be39b"/>
  </g>

  <g transform="translate(258 84)">
    <rect x="0" y="0" width="440" height="272" rx="26" fill="#08131d" stroke="#33435f"/>
    <rect x="26" y="28" width="388" height="204" rx="20" fill="url(#pitch)" stroke="#9affdf" opacity=".93"/>
    <rect x="52" y="52" width="336" height="156" rx="10" fill="none" stroke="#d7fff0" opacity=".44"/>
    <line x1="220" y1="28" x2="220" y2="232" stroke="#d7fff0" opacity=".48"/>
    <circle cx="220" cy="130" r="37" fill="none" stroke="#d7fff0" opacity=".48"/>
    <circle cx="220" cy="130" r="4" fill="#fff"/>
    <rect x="26" y="92" width="42" height="76" fill="none" stroke="#d7fff0" opacity=".44"/>
    <rect x="372" y="92" width="42" height="76" fill="none" stroke="#d7fff0" opacity=".44"/>

    <g filter="url(#glow)">
      <circle cx="98" cy="78" r="7" fill="#fff"/>
      <circle cx="134" cy="162" r="7" fill="#fff"/>
      <circle cx="188" cy="116" r="7" fill="#fff"/>
      <circle cx="270" cy="90" r="7" fill="#ffd464"/>
      <circle cx="320" cy="160" r="7" fill="#ffd464"/>
      <circle cx="364" cy="76" r="7" fill="#ffd464"/>
    </g>
    <path d="M98 78 L188 116 L270 90 L320 160" fill="none" stroke="#ffffff" opacity=".5" stroke-width="2" stroke-dasharray="6 6"/>
    <path d="M134 162 L188 116 L364 76" fill="none" stroke="#ffd464" opacity=".55" stroke-width="2" stroke-dasharray="5 7"/>

    <g transform="translate(22 244)">
      <rect width="116" height="14" rx="7" fill="#26324a"/>
      <rect width="86" height="14" rx="7" fill="#2be39b"/>
      <rect x="150" width="116" height="14" rx="7" fill="#26324a"/>
      <rect x="150" width="68" height="14" rx="7" fill="#55d8ff"/>
      <rect x="300" width="116" height="14" rx="7" fill="#26324a"/>
      <rect x="300" width="98" height="14" rx="7" fill="#a889ff"/>
    </g>
  </g>

  <g transform="translate(74 176)">
    <rect width="174" height="124" rx="22" fill="#101827" stroke="#2a3957"/>
    <text x="18" y="31" fill="#91a1bc" font-family="Inter,Segoe UI,sans-serif" font-size="14">Mejor mercado</text>
    <text x="18" y="65" fill="#f6f8fc" font-family="Inter,Segoe UI,sans-serif" font-size="25" font-weight="800">1X2</text>
    <text x="18" y="95" fill="#2be39b" font-family="Inter,Segoe UI,sans-serif" font-size="20" font-weight="800">EV +18%</text>
  </g>

  <g transform="translate(722 226)">
    <rect width="188" height="122" rx="22" fill="#101827" stroke="#2a3957"/>
    <text x="18" y="31" fill="#91a1bc" font-family="Inter,Segoe UI,sans-serif" font-size="14">Kelly</text>
    <text x="18" y="69" fill="#f6f8fc" font-family="Inter,Segoe UI,sans-serif" font-size="34" font-weight="800">3%</text>
    <path d="M92 88 C116 48, 156 60, 170 28" fill="none" stroke="url(#accent)" stroke-width="5" stroke-linecap="round"/>
  </g>
</svg>
